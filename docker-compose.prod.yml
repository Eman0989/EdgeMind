services:
  backend:
    image: ghcr.io/eman0989/edgemind-backend:latest

    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: sqlite:////data/edgemind.db
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set}"

    volumes:
      - edgemind-data:/data

    restart: unless-stopped

  frontend:
    image: ghcr.io/eman0989/edgemind-frontend:latest

    environment:
      BACKEND_UPSTREAM: http://backend:8000

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  edgemind-data:
