name: EdgeMind CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker stack
        env:
          SECRET_KEY: edgemind-ci-docker-secret-key
        run: docker compose up -d

      - name: Wait for healthy containers
        run: |
          for attempt in {1..30}; do
            backend_id="$(docker compose ps -q backend)"
            frontend_id="$(docker compose ps -q frontend)"

            backend_health="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                "$backend_id" 2>/dev/null || true
            )"

            frontend_health="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                "$frontend_id" 2>/dev/null || true
            )"

            echo "Attempt $attempt: backend=$backend_health frontend=$frontend_health"

            if [[ "$backend_health" == "healthy" && "$frontend_health" == "healthy" ]]; then
              echo "Both containers are healthy."
              exit 0
            fi

            sleep 2
          done

          echo "Containers did not become healthy."
          docker compose ps
          docker compose logs
          exit 1

      - name: Test backend health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8001/api/health

      - name: Test frontend health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/health

      - name: Test API through Nginx
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/api/health

      - name: Test React Router fallback
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/login \
            > /dev/null

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      FRONTEND_IMAGE: ghcr.io/eman0989/edgemind-frontend
      BACKEND_IMAGE: ghcr.io/eman0989/edgemind-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
            -t "${FRONTEND_IMAGE}:latest" \
            -t "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}" \
            .

      - name: Build backend image
        run: |
          docker build \
            -t "${BACKEND_IMAGE}:latest" \
            -t "${BACKEND_IMAGE}:sha-${GITHUB_SHA}" \
            ./backend

      - name: Push frontend image
        run: |
          docker push "${FRONTEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}"

      - name: Push backend image
        run: |
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${BACKEND_IMAGE}:sha-${GITHUB_SHA}"

      - name: Show published image names
        run: |
          echo "Frontend:"
          echo "${FRONTEND_IMAGE}:latest"
          echo "${FRONTEND_IMAGE}:sha-${GITHUB_SHA}"

          echo
          echo "Backend:"
          echo "${BACKEND_IMAGE}:latest"
          echo "${BACKEND_IMAGE}:sha-${GITHUB_SHA}"
